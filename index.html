<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="app-version" content="0.2.2">
<meta name="theme-color" content="#0B0B0F">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Хаха. Знакомства по приколу</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%98%82%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes/night.css">
<link rel="stylesheet" href="css/themes/meme.css">
<link rel="stylesheet" href="css/themes/journal.css">
<link rel="stylesheet" href="css/themes/sticker.css">
<script src="js/theme.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="app">
      <section class="screen" data-screen="splash"></section>
      <section class="screen" data-screen="onboarding"></section>
      <section class="screen" data-screen="quiz"></section>
      <section class="screen" data-screen="style"></section>
      <section class="screen" data-screen="result"></section>
      <section class="screen tabroot" data-screen="feed"></section>
      <section class="screen" data-screen="person"></section>
      <section class="screen tabroot" data-screen="likes"></section>
      <section class="screen tabroot" data-screen="chats"></section>
      <section class="screen" data-screen="chat"></section>
      <section class="screen" data-screen="jotd"></section>
      <section class="screen tabroot" data-screen="me"></section>
      <section class="screen" data-screen="filters"></section>
    </div>
    <div id="overlay"></div>
    <nav id="tabbar" class="tabbar" hidden>
      <button class="tab" data-tab="feed" type="button"><span class="ico">🃏</span><span>Анкеты</span></button>
      <button class="tab" data-tab="likes" type="button"><span class="ico">🔥</span><span>Лайки</span><span class="dot" hidden></span></button>
      <button class="tab" data-tab="chats" type="button"><span class="ico">💬</span><span>Чаты</span><span class="dot" hidden></span></button>
      <button class="tab" data-tab="me" type="button"><span class="ico">🙂</span><span>Профиль</span></button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <aside id="theme-dock" aria-label="Оформление"></aside>
</div>
<script src="js/data.js"></script>
<script src="js/humor.js"></script>
<script src="js/swipe.js"></script>
<script src="js/tg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
